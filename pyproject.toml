[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aoce"
version = "0.1.0"
description = "AI On-Call Engineer: investigates alerts and answers 'what changed and why did it break?' with cited evidence."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13,<2",
    "fastapi>=0.143",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14",
    "pydantic-settings>=2.15",
    "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "pyyaml>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/aoce"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
