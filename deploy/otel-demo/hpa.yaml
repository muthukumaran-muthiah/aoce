# CPU-based autoscaling for the stateless request-path services of the demo.
# Scales 1 -> 3 replicas when average CPU exceeds 200% of the (deliberately small) CPU request
# in values.yaml, e.g. 40m for a 20m request. No CPU limits are set, so pods can burst above it.
# Memory is not used as a scaling signal: JVM/.NET/Node runtimes hold memory after load
# and would never scale back down. Requires metrics-server (bundled with Rancher Desktop / k3s).
# Not autoscaled on purpose: astronomy-db, kafka, valkey-cart, flagd (stateful/singletons),
# accounting, fraud-detection (Kafka consumers), load-generator, observability stack.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: otel-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 200
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
---
